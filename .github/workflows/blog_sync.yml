name: Update Blog Posts

on:
  schedule:
    - cron: "30 0 * * *" # Daily at 00:30 UTC (after blog deploy at 00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with Blog RSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Update Blog Posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://void-zero.me/blog/feed.xml"
          max_post_count: 5
          template: "- [$title]($url) - $date$newline"
          date_format: "yyyy-mm-dd"
          comment_tag_name: "BLOG-POST-LIST"
          tag_post_pre_newline: true
          commit_message: "chore: update recent blog posts"
