name: WakaTime Sync

on:
  schedule:
    - cron: "30 1 * * *" # Daily at 01:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Update WakaTime Stats
        uses: anmol098/waka-readme-stats@master
        with:
          # Since 2026-11-01, WakaTime requires a personal OAuth Access Token
          # (https://wakatime.com/oauth) stored in the WAKATIME_API_KEY secret.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}

          # Display & formatting
          LOCALE: "en"
          BADGE_STYLE: "flat-square"
          SYMBOL_VERSION: "1"
          BAR_STYLE: "text"
          # Note: BAR_STYLE: "svg" currently renders blank on GitHub profiles because
          # GitHub sanitizes inline <svg> tags (see anmol098/waka-readme-stats#699).
          # Re-enable once upstream switches to external SVG assets:
          # BAR_STYLE: "svg"
          # BAR_RADIUS: "4"
          # BAR_COLOR: "#58a6ff"
          # BAR_TRACK_COLOR: "#30363d"
          # TEXT_PRIMARY_COLOR: "#7d8590"
          # TEXT_SECONDARY_COLOR: "#8b949e"

          # Weekly coding & AI metrics
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_AI_CODE_TIME: "True"
          SHOW_AI_CODING: "True"
          SHOW_TIMEZONE: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"

          # Disabled noisy / outdated / slow metrics
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROJECTS: "False"
          SHOW_SHORT_INFO: "False"
